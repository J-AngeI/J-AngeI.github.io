<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logic Gate Puzzle</title>
  <style>
    html, body { height: 100%; margin: 0; background: #222; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      border: 0;
      width: min(100vw, calc(100vh * 1400 / 900));
      aspect-ratio: 1400 / 900;
      height: auto;
    }
  </style>
</head>
<body>
  <iframe id="game" src="game/game.html" tabindex="0"></iframe>

  <script>
    const f = document.getElementById('game');
    f.addEventListener('load', () => f.contentWindow.focus());
    f.addEventListener('mouseenter', () => f.contentWindow.focus());
  </script>
</body>
</html>
